name: Deploy Encrypted CV

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'encrypt-inject.js'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Encrypt and inject contact details
        run: |
          node encrypt-inject.js index.html index-encrypted.html
        env:
          CONTACT_DETAILS: ${{ secrets.CONTACT_DETAILS }}
          ENCRYPTION_PASSWORD: ${{ secrets.ENCRYPTION_PASSWORD }}

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp index-encrypted.html deploy/index.html
          cp CNAME deploy/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: false
