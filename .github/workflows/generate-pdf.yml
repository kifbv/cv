name: Generate PDF from DOCX

on:
  push:
    branches: [ main ]
    paths:
      - '*.docx'
  workflow_dispatch:  # Allow manual trigger

jobs:
  convert-to-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra

      - name: Convert DOCX to PDF
        run: |
          pandoc CV_Franck_Ratier_2025.docx -o CV_Franck_Ratier_2025.pdf --pdf-engine=pdflatex

      - name: Commit and push PDF
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add CV_Franck_Ratier_2025.pdf
          git diff --staged --quiet || git commit -m "Auto-generate PDF from DOCX"
          git push
